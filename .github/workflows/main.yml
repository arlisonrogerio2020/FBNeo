name: Compilar FBNeo AArch64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar Core
        working-directory: src/burner/libretro
        run: |
          make -j$(nproc)
          strip fbneo_libretro.so

      - name: Disponibilizar Download
        uses: actions/upload-artifact@v4
        with:
          name: fbneo_libretro_aarch64
          path: src/burner/libretro/fbneo_libretro.so
